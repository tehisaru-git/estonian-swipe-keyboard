name: 🐛 Bug Report
description: Report an issue with Viipio keyboard (current typing languages ET/EN)
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us fix the issue.

  - type: input
    id: version
    attributes:
      label: Viipio version
      description: Which Viipio release or build are you using?
      placeholder: "e.g., v0.5.0"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device Information
      description: What device are you using?
      options:
        - Android Phone
        - Android Tablet
        - Chromebook
        - Other (please specify in description)
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: What version of Android are you running?
      placeholder: "e.g., Android 13, Android 14"
    validations:
      required: true

  - type: dropdown
    id: bug-category
    attributes:
      label: Bug Category
      description: What type of issue are you experiencing?
      options:
        - Swipe typing or suggestions
        - Keyboard layout or keys
        - Performance (lag, memory, battery)
        - Settings (configuration, preferences)
        - Gestures or long press
        - Local swipe diagnostics
        - Installation (APK install, permissions)
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clearly describe what the bug is and what you expected to happen.
      placeholder: |
        1. What were you trying to do?
        2. What happened instead?
        3. What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Open Viipio keyboard
        2. Go to Settings...
        3. Tap on...
        4. Bug appears...
    validations:
      required: true

  - type: textarea
    id: swipe-config
    attributes:
      label: Swipe Configuration (if applicable)
      description: If this is a swipe issue, include the selected ET/EN language, expected word and any relevant settings. Avoid personal text.
      placeholder: |
        - Language: ET or EN
        - Expected word (nonpersonal example):
        - Relevant preferences:

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If possible, provide relevant redacted adb logs. Logs and diagnostics can contain typed words; do not post secrets or raw personal text.
      render: shell

  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting Steps
      description: Please confirm you've tried these basic troubleshooting steps.
      options:
        - label: I have restarted Viipio keyboard
        - label: I have tried disabling and re-enabling the keyboard
        - label: I have checked whether this happens in both ET and EN (if relevant)
        - label: I have checked whether this happens in another non-sensitive text field (if relevant)

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information that might help.
      placeholder: Screenshots, screen recordings, or any other relevant information...